<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <meta name="theme-color" content="#eeeeee">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
            background-color: #eeeeee;
        }

        .container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            position: relative;
            background-color: #c0c0c0;
            border-radius: 18px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2),
                       0 8px 16px rgba(0, 0, 0, 0.2),
                       0 16px 32px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        .card-front {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 1;
            z-index: 1;
            background-color: white;
        }

        .card-front.revealed {
            opacity: 1;
            transform: none;
        }

        #scratchCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            border-radius: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card-container">
            <div class="card">
                <div class="card-front"></div>
                <canvas id="scratchCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                const localHosts = ['localhost', '127.0.0.1', '[::1]'];
                if (localHosts.includes(location.hostname)) {
                    try {
                        const registration = await navigator.serviceWorker.getRegistration('./sw.js');
                        const workerURL = new URL('./sw.js', location.href).href;
                        if (registration?.scope === new URL('./', location.href).href &&
                            [registration.active, registration.waiting, registration.installing]
                                .some(worker => worker?.scriptURL === workerURL)) {
                            const controlled = navigator.serviceWorker.controller?.scriptURL === workerURL;
                            if (await registration.unregister() && controlled) location.reload();
                        }
                    } catch (error) {
                        console.warn('Could not disable offline support locally:', error);
                    }
                    return;
                }
                navigator.serviceWorker.register('./sw.js').catch(error => {
                    console.warn('Offline support unavailable:', error);
                });
            });
        }

        const gridValues = [
            ['ace', '2', '3'],
            ['4', '5', '6'],
            ['7', '8', '9']
        ];
        const dbGridValues = [
            ['10', 'jack'],
            ['queen', 'king']
        ];
        const scratchDirections = {
            up: 'spades',
            right: 'hearts',
            down: 'clubs',
            left: 'diamonds'
        };
        const cardContainer = document.querySelector('.card-container');
        const cardFront = document.querySelector('.card-front');
        const card = document.querySelector('.card');
        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        let isRevealed = false;
        let isScratching = false;
        let lastX, lastY;
        let pinchStartDistance = null;
        let pinchPending = false;
        let ignoreUntilLift = false;
        let touchStartTime = 0;
        let touchCount = 0;
        let touchStartX, touchStartY;

        // Card aspect ratio
        const CARD_ASPECT_RATIO = 0.69;
        function resizeCard() {
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight;
            
            let cardWidth, cardHeight;
            
            if (containerWidth / containerHeight > CARD_ASPECT_RATIO) {
                cardHeight = containerHeight * 0.9;
                cardWidth = cardHeight * CARD_ASPECT_RATIO;
            } else {
                cardWidth = containerWidth * 0.9;
                cardHeight = cardWidth / CARD_ASPECT_RATIO;
            }
            
            card.style.width = `${cardWidth}px`;
            card.style.height = `${cardHeight}px`;

            canvas.width = cardWidth;
            canvas.height = cardHeight;

            // Change border-radius of card
            card.style.borderRadius = `${0.04 * cardWidth}px`;
            cardFront.style.borderRadius = `${0.04 * cardWidth}px`;
            canvas.style.borderRadius = `${0.04 * cardWidth}px`;

            restoreCoating();
        }

        function restoreCoating() {
            ctx.globalCompositeOperation = 'source-over';
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#e0e0e0');
            gradient.addColorStop(0.5, '#c0c0c0');
            gradient.addColorStop(1, '#a0a0a0');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        resizeCard();
        window.addEventListener('resize', resizeCard);

        function getPosition(x, y, s) {
            const rect = card.getBoundingClientRect();
            const cellWidth = rect.width / s;
            const cellHeight = rect.height / s;
            
            const col = Math.floor((x - rect.left) / cellWidth);
            const row = Math.floor((y - rect.top) / cellHeight);
            
            // Ensure we're within bounds
            const boundedCol = Math.max(0, Math.min(s-1, col));
            const boundedRow = Math.max(0, Math.min(s-1, row));
            
            return { row: boundedRow, col: boundedCol };
        }

        function getDirection(startX, startY, endX, endY) {
            const dx = endX - startX;
            const dy = endY - startY;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);
            
            if (absDx > absDy) {
                return dx > 0 ? 'right' : 'left';
            } else {
                return dy > 0 ? 'down' : 'up';
            }
        }

        function resetCard() {
            isRevealed = false;
            cardFront.style.backgroundImage = '';
            cardFront.classList.remove('revealed');
            restoreCoating();
        }

        function revealCard(x, y, scratchDirection, isDouble) {
            if (isRevealed) return;
            const { row, col } = getPosition(x, y, isDouble ? 2 : 3);
            const value = isDouble ? dbGridValues[row][col] : gridValues[row][col];
            const suit = scratchDirections[scratchDirection];
            cardFront.style.backgroundImage = `url('cards/${value}_of_${suit}.svg')`;
            cardFront.classList.add('revealed');
            isRevealed = true;
        }

        function scratch(x, y) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const canvasX = (x - rect.left) * scaleX;
            const canvasY = (y - rect.top) * scaleY;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = canvas.width * 0.1;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            if (lastX !== undefined && lastY !== undefined) {
                const lastCanvasX = (lastX - rect.left) * scaleX;
                const lastCanvasY = (lastY - rect.top) * scaleY;
                
                ctx.beginPath();
                ctx.moveTo(lastCanvasX, lastCanvasY);
                ctx.lineTo(canvasX, canvasY);
                ctx.stroke();
            }
        }

        function touchDistance(touches) {
            return Math.hypot(
                touches[1].clientX - touches[0].clientX,
                touches[1].clientY - touches[0].clientY
            );
        }

        function handleTouchStart(e) {
            e.preventDefault();
            if (ignoreUntilLift) return;
            if (e.touches.length > 2) {
                isScratching = false;
                ignoreUntilLift = true;
                return;
            }
            pinchStartDistance = e.touches.length === 2 ? touchDistance(e.touches) : null;
            pinchPending = false;
            const touch = e.touches[0];
            lastX = touch.clientX;
            lastY = touch.clientY;
            touchStartX = lastX;
            touchStartY = lastY;
            touchStartTime = Date.now();
            touchCount = e.touches.length;
            isScratching = true;
            if (touchCount === 1) scratch(lastX, lastY);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!isScratching || ignoreUntilLift) return;
            if (pinchStartDistance !== null && e.touches.length === 2) {
                const contraction = pinchStartDistance - touchDistance(e.touches);
                // Reserve inward motion for a pinch; parallel motion remains a swipe.
                if (contraction > 8) pinchPending = true;
                if (contraction >= Math.max(30, pinchStartDistance * 0.2)) {
                    resetCard();
                    isScratching = false;
                    ignoreUntilLift = true;
                    return;
                }
                if (pinchPending) return;
            }
            const touch = e.touches[0];
            const currentX = touch.clientX;
            const currentY = touch.clientY;

            // Check for card selection on significant movement
            if (!isRevealed) {
                const dx = currentX - touchStartX;
                const dy = currentY - touchStartY;
                if (Math.sqrt(dx * dx + dy * dy) > 20) {
                    const scratchDirection = getDirection(touchStartX, touchStartY, currentX, currentY);
                    const isDouble = touchCount >= 2 || e.shiftKey;
                    revealCard(touchStartX, touchStartY, scratchDirection, isDouble);
                }
            }

            // Draw smooth scratch line
            const dx = currentX - lastX;
            const dy = currentY - lastY;
            const steps = Math.max(Math.floor(Math.sqrt(dx * dx + dy * dy) / 2), 1);
            
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                scratch(lastX + dx * t, lastY + dy * t);
            }

            lastX = currentX;
            lastY = currentY;
        }

        function handleTouchEnd(e) {
            // Only a single-finger gesture can finish as a quick tap.
            if (e.type !== 'touchcancel' && isScratching && !ignoreUntilLift &&
                !pinchPending && touchCount === 1 && touchStartX !== undefined &&
                Date.now() - touchStartTime < 500 && !isRevealed) {
                const touch = e.changedTouches[0];
                const direction = getDirection(touchStartX, touchStartY, touch.clientX, touch.clientY);
                revealCard(touchStartX, touchStartY, direction, false);
            }

            isScratching = false;
            ignoreUntilLift = e.touches.length > 0;
            pinchStartDistance = null;
            pinchPending = false;
            lastX = lastY = touchStartX = touchStartY = undefined;
        }

        // Add touch event listeners
        cardContainer.addEventListener('touchstart', handleTouchStart, { passive: false });
        cardContainer.addEventListener('touchmove', handleTouchMove, { passive: false });
        cardContainer.addEventListener('touchend', handleTouchEnd);
        cardContainer.addEventListener('touchcancel', handleTouchEnd);

        // Prevent default touch behavior
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
